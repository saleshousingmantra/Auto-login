<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --text:#1d2129; --muted:#6b7280; --accent:#2563eb; --border:#d1d5db; --ok:#16a34a; --err:#dc2626; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --card:#1a1d23; --text:#e5e7eb; --muted:#9ca3af; --border:#374151; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg);
         font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:var(--text); padding:16px; }
  .card { width:100%; max-width:380px; background:var(--card); border-radius:14px; padding:28px;
          box-shadow:0 8px 30px rgba(0,0,0,.08); }
  h1 { margin:0 0 4px; font-size:22px; }
  p.sub { margin:0 0 22px; color:var(--muted); font-size:14px; }
  label { display:block; font-size:13px; font-weight:600; margin-bottom:6px; }
  input[type=email], input[type=password] { width:100%; padding:11px 12px; border:1px solid var(--border);
         border-radius:8px; font-size:15px; background:transparent; color:var(--text); margin-bottom:16px; }
  input:focus { outline:2px solid var(--accent); outline-offset:1px; border-color:transparent; }
  .row { display:flex; align-items:center; gap:8px; font-size:14px; margin-bottom:18px; color:var(--muted); }
  button { width:100%; padding:12px; border:0; border-radius:8px; background:var(--accent); color:#fff;
           font-size:15px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .status { margin-top:14px; font-size:14px; min-height:20px; text-align:center; }
  .status.ok { color:var(--ok); } .status.err { color:var(--err); }
  .status a { color:var(--accent); cursor:pointer; text-decoration:underline; }
  #home { display:none; text-align:center; }
  #home button { margin-top:16px; background:#6b7280; }
  /* Lets JS detect when the browser autofills a field */
  @keyframes onAutoFill { from {} to {} }
  input:-webkit-autofill { animation-name: onAutoFill; animation-duration: 1ms; }
</style>
</head>
<body>
<div class="card">
  <form id="loginForm" autocomplete="on">
    <h1>Welcome back</h1>
    <p class="sub">Sign in to continue</p>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    <label class="row"><input type="checkbox" id="remember" checked> Remember me &amp; sign in automatically</label>

    <button type="submit" id="loginBtn">Log in</button>
    <div class="status" id="status"></div>
  </form>

  <div id="home">
    <h1>You're signed in 🎉</h1>
    <p class="sub" id="who"></p>
    <button id="logoutBtn">Log out</button>
  </div>
</div>

<script>
const form = document.getElementById('loginForm');
const emailEl = document.getElementById('email');
const passEl = document.getElementById('password');
const rememberEl = document.getElementById('remember');
const btn = document.getElementById('loginBtn');
const statusEl = document.getElementById('status');
const AUTO_LOGIN_DELAY = 3;          // seconds before auto-submit (user can cancel)
const LS_EMAIL = 'autoLogin.email';  // only the email is kept here, never the password
const LS_AUTO  = 'autoLogin.enabled';
let countdownTimer = null;
let autoCancelled = false;
let loggingIn = false;

const supportsCredAPI = 'credentials' in navigator && 'PasswordCredential' in window;
const ls = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch {} },
  del(k){ try { localStorage.removeItem(k); } catch {} },
};

function setStatus(html, cls = '') { statusEl.className = 'status ' + cls; statusEl.innerHTML = html; }

// ---- Replace this with your real backend call ----
async function loginRequest(email, password) {
  // const res = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'},
  //   body: JSON.stringify({ email, password }), credentials:'include' });
  // if (!res.ok) throw new Error('Invalid email or password');
  // return res.json();
  await new Promise(r => setTimeout(r, 700)); // demo delay
  if (password.length < 4) throw new Error('Invalid email or password');
  return { email };
}

async function doLogin() {
  stopCountdown();
  const email = emailEl.value.trim(), password = passEl.value;
  if (!email || !password || loggingIn) return;
  loggingIn = true; btn.disabled = true; setStatus('Signing in…');
  try {
    await loginRequest(email, password);
    if (rememberEl.checked) {
      ls.set(LS_EMAIL, email); ls.set(LS_AUTO, '1');
      // Chrome/Edge: save to the browser password manager (shows the "Save password?" prompt)
      if (supportsCredAPI) {
        try { await navigator.credentials.store(new PasswordCredential({ id: email, password, name: email })); }
        catch (e) { console.warn('store failed', e); }
      }
    } else {
      ls.del(LS_EMAIL); ls.del(LS_AUTO);
    }
    showHome(email);
  } catch (e) {
    setStatus(e.message || 'Login failed', 'err');
  } finally {
    loggingIn = false; btn.disabled = false;
  }
}
form.addEventListener('submit', e => { e.preventDefault(); doLogin(); });

// ---------- Auto sign-in countdown ----------
function stopCountdown() { clearInterval(countdownTimer); countdownTimer = null; }
function startCountdown() {
  if (autoCancelled || countdownTimer || loggingIn || ls.get(LS_AUTO) === '0') return;
  try { if (sessionStorage.getItem('autoLogin.loggedOut')) return; } catch {}
  if (!emailEl.value || !passEl.value) return;
  let n = AUTO_LOGIN_DELAY;
  const tick = () => setStatus(`Signing you in automatically in ${n}s… <a id="cancelAuto">Cancel</a>`);
  tick();
  countdownTimer = setInterval(() => {
    n--;
    if (n <= 0) { stopCountdown(); btn.click(); }   // triggers the login button
    else tick();
  }, 1000);
}
statusEl.addEventListener('click', e => {
  if (e.target.id === 'cancelAuto') { autoCancelled = true; stopCountdown(); setStatus('Auto sign-in cancelled'); }
});

// ---------- 1) Chrome/Edge: read saved credential directly ----------
async function tryCredentialAPI() {
  if (!supportsCredAPI) return false;
  try {
    const cred = await navigator.credentials.get({ password: true, mediation: 'optional' });
    if (cred && cred.password) {
      emailEl.value = cred.id; passEl.value = cred.password;
      startCountdown();
      return true;
    }
  } catch (e) { console.warn('credentials.get failed', e); }
  return false;
}

// ---------- 2) Any browser: detect the browser's own autofill ----------
// Chrome hides autofilled values from JS until the user taps/clicks the page,
// so if we see autofill but can't read it yet, we ask for one tap.
let autofillSeen = false;
function onAutofillDetected() {
  autofillSeen = true;
  setTimeout(() => {
    if (emailEl.value && passEl.value) startCountdown();
    else if (!countdownTimer && !loggingIn) setStatus('Saved login found — tap anywhere to sign in');
  }, 50);
}
[emailEl, passEl].forEach(el => {
  el.addEventListener('animationstart', e => { if (e.animationName === 'onAutoFill') onAutofillDetected(); });
});
// Safari / Firefox / mobile: picking a saved login fills both fields at once
let lastInputAt = 0;
[emailEl, passEl].forEach(el => el.addEventListener('input', e => {
  const now = Date.now();
  const bulkFill = !e.inputType || e.inputType === 'insertReplacementText' || (now - lastInputAt < 100);
  lastInputAt = now;
  if (bulkFill && emailEl.value && passEl.value) { autofillSeen = true; startCountdown(); }
  else if (countdownTimer) { stopCountdown(); setStatus(''); }   // user is typing → stop auto-login
}));
// After the first tap, Chrome releases the autofilled values
document.addEventListener('pointerdown', () => {
  setTimeout(() => { if (autofillSeen && emailEl.value && passEl.value) startCountdown(); }, 100);
}, { once: true });

// ---------- Home / logout ----------
function showHome(email) {
  form.style.display = 'none';
  document.getElementById('home').style.display = 'block';
  document.getElementById('who').textContent = email;
}
document.getElementById('logoutBtn').addEventListener('click', async () => {
  if (supportsCredAPI) { try { await navigator.credentials.preventSilentAccess(); } catch {} }
  try { sessionStorage.setItem('autoLogin.loggedOut','1'); } catch {}  // no auto-login again in this tab
  document.getElementById('home').style.display = 'none';
  form.style.display = 'block';
  passEl.value = '';
  setStatus('Logged out', 'ok');
});

// ---------- Startup ----------
window.addEventListener('load', async () => {
  if (!window.isSecureContext) {
    setStatus('Open this page over HTTPS (e.g. GitHub Pages) — browsers won\'t save or autofill passwords otherwise.', 'err');
    return;
  }
  const savedEmail = ls.get(LS_EMAIL);
  if (savedEmail && !emailEl.value) emailEl.value = savedEmail;
  if (await tryCredentialAPI()) return;
  if (savedEmail && !passEl.value) {
    setStatus('Tap the password field and pick your saved password to sign in automatically');
  }
});
</script>
</body>
</html>
